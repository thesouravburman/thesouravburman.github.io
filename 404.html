<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Sourav Burman</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808; color: #F5F5F0;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 300; line-height: 1;
      color: #C9A84C; opacity: .15;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none; user-select: none;
    }
    .inner { position: relative; z-index: 1; }
    .label {
      font-size: .65rem; letter-spacing: .3em;
      color: #C9A84C; opacity: .7; margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 300; margin-bottom: 1rem;
    }
    p {
      font-size: .8rem; color: rgba(245,245,240,.4);
      letter-spacing: .05em; margin-bottom: 3rem;
      line-height: 1.8;
    }
    a {
      font-size: .75rem; letter-spacing: .18em;
      color: #C9A84C; text-decoration: none;
      border: 1px solid rgba(201,168,76,.3);
      padding: .75rem 2rem; border-radius: 4px;
      transition: border-color .3s, color .3s;
    }
    a:hover { border-color: #C9A84C; color: #E8C97A; }
    .grain {
      position: fixed; inset: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px; opacity: .025; mix-blend-mode: overlay;
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="code">404</div>
  <div class="inner">
    <p class="label">ERROR · PAGE NOT FOUND</p>
    <h1>This chapter doesn't exist.</h1>
    <p>The page you're looking for has moved,<br/>been removed, or never existed.</p>
    <a href="/">← Return to Portfolio</a>
  </div>
</body>
</html>
